[package]
name = "catcrewai"
version = "0.1.0"
description = "CatCrewAI desktop shell: a native window around the React UI, plus (optionally) the Python backend."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "catcrewai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
